name: Preview photos

# Contact sheets for the weekly review. The review commits discovery/preview_request.json to the
# `previews` branch and dispatches this on that branch; the sheets land in previews/ on the same branch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pillow numpy opencv-python-headless
      - run: python discovery/preview.py
      - name: Save the sheets
        run: |
          git add -A previews
          bash .github/save.sh "Previews $(date -u +%Y-%m-%dT%H:%MZ)" "${GITHUB_REF_NAME}"
