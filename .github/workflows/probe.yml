name: Probe source addresses

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python discovery/probe.py
      - run: |
          git add discovery/probe_report.json
          bash .github/save.sh "Probe report $(date -u +%Y-%m-%d)"
