name: Archive search

# loc.gov answers 429 to GitHub's shared runners after one or two searches, so the archive search runs
# every three hours on a handful of targets and resumes from discovery/archive_candidates.json's next_target.
# Earlier finds are kept when a run is blocked. The Monday harvest still runs it once as well.

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "Start at this target number (0-based) instead of the saved cursor"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: archive-search
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python discovery/archive_search.py
        env:
          ARCHIVE_TARGETS_PER_RUN: "6"
          ARCHIVE_START: ${{ inputs.start }}
      # Always saved, even when nothing new was found: discovery/health/archive.json is how the daily
      # heartbeat knows this job ran and whether loc.gov let it search.
      - name: Save
        run: |
          git add discovery/archive_candidates.json discovery/health
          bash .github/save.sh "Archive search $(date -u +%Y-%m-%dT%H:%MZ)"
