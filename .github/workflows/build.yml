name: Build posts

on:
  push:
    branches: [main]
    paths: ["batches/**", "build/**", "grade/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-posts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pillow numpy opencv-python-headless

      # Finished slides live on the gh-pages branch, which is rewritten as a single commit each run.
      # That keeps main free of image files and the repository small for years.
      - name: Restore existing slides
        run: |
          if git fetch origin gh-pages --depth 1 2>/dev/null; then
            git worktree add /tmp/pages origin/gh-pages
            mkdir -p docs && cp -r /tmp/pages/. docs/ && rm -rf docs/.git
          fi

      - name: Build slides
        run: python build/build_posts.py

      - name: Prune posts built more than 120 days ago
        run: python build/prune.py 120

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "Bureau of Leisure"
          git config user.email "lewie@flow.agency"
          git add -A
          git commit -q -m "Publish slides $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
