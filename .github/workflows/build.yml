name: Build posts

on:
  push:
    branches: [main]
    paths: ["batches/**", "build/**", "grade/**"]
  workflow_dispatch:
    inputs:
      attempt:
        description: "Follow-up run number (set by the build itself when it runs out of time)"
        required: false
        default: "1"

permissions:
  contents: write
  actions: write      # lets a build that ran out of time start its own follow-up run

concurrency:
  group: build-posts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pillow numpy opencv-python-headless boto3

      # Finished slides live on the gh-pages branch, which is rewritten as a single commit each run.
      # That keeps main free of image files and the repository small for years.
      - name: Restore existing slides
        run: |
          if git fetch origin gh-pages --depth 1 2>/dev/null; then
            git worktree add /tmp/pages origin/gh-pages
            mkdir -p docs && cp -r /tmp/pages/. docs/ && rm -rf docs/.git
          fi

      - name: Build slides
        run: python -u build/build_posts.py
        env:
          PYTHONUNBUFFERED: "1"
          ARCHIVE_ENDPOINT: ${{ secrets.ARCHIVE_ENDPOINT }}
          ARCHIVE_BUCKET: ${{ secrets.ARCHIVE_BUCKET }}
          ARCHIVE_KEY_ID: ${{ secrets.ARCHIVE_KEY_ID }}
          ARCHIVE_SECRET: ${{ secrets.ARCHIVE_SECRET }}

      - name: Prune posts built more than 120 days ago
        run: python build/prune.py 120

      - name: Put photo-starved posts on the watch list
        run: |
          python discovery/watch.py add docs/manifest.json
          git add discovery/watchlist.json
          bash .github/save.sh "Watch list updated after build" || echo "::warning::watch list not saved; the slides still publish"

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish slides $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      # The build stops starting downloads after 18 minutes and publishes what it has. Whatever it did not
      # reach is listed in .build_pending; run again for those, three runs at most, then go red.
      - name: Run again for posts left unbuilt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTEMPT: ${{ inputs.attempt || '1' }}
        run: |
          LEFT=$(cat .build_pending 2>/dev/null || true)
          [ -z "$LEFT" ] && exit 0
          if [ "$ATTEMPT" -lt 3 ]; then
            echo "Posts left unbuilt: $LEFT. Starting run $((ATTEMPT + 1))."
            gh workflow run build.yml --ref main -f attempt=$((ATTEMPT + 1))
          else
            echo "::error::Posts still unbuilt after three runs: $LEFT"
            exit 1
          fi
