name: Harvest sources

on:
  schedule:
    - cron: "23 12 * * 1"    # Mondays 8:23am New York, after the source check
  workflow_dispatch:
    inputs:
      shortlist:
        description: "Re-harvest discovery/shortlist.json only"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python discovery/harvest.py
        env:
          HARVEST_SHORTLIST: ${{ inputs.shortlist && '1' || '' }}
      - name: Save the harvest
        run: |
          git config user.name "Bureau of Leisure"
          git config user.email "lewie@flow.agency"
          git add discovery/harvest
          git diff --cached --quiet && exit 0
          git commit -m "Harvest $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main
          git push
