name: Harvest sources

on:
  schedule:
    - cron: "23 12 * * 1"    # Mondays 8:23am New York, after the source check
  workflow_dispatch:
    inputs:
      shortlist:
        description: "Re-harvest discovery/shortlist.json only"
        type: boolean
        default: false
      archive_only:
        description: "Run only the archive search"
        type: boolean
        default: false
      portfolio_pages:
        description: "New project pages to take from each portfolio site (default 6; raise for a catch-up run)"
        required: false
        default: ""

permissions:
  contents: write

# The Monday harvest and the 6-hourly archive search both write discovery/archive_candidates.json.
# One group, so they queue instead of racing (2026-11-09: the harvest lost its commit to that race).
concurrency:
  group: archive-search
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pillow numpy opencv-python-headless
      - run: python -u discovery/harvest.py
        if: ${{ !inputs.archive_only }}
        env:
          HARVEST_SHORTLIST: ${{ inputs.shortlist && '1' || '' }}
          HARVEST_PORTFOLIO_PAGES: ${{ inputs.portfolio_pages }}
      - name: Archive search only
        if: ${{ inputs.archive_only }}
        run: python discovery/archive_search.py
      - name: Grow sources from credits, re-check the watch list, search the archives
        if: ${{ !inputs.shortlist && !inputs.archive_only }}
        run: |
          python discovery/grow_sources.py
          python discovery/watch.py check
          python discovery/archive_search.py
      - name: Save the harvest
        run: |
          git add discovery
          bash .github/save.sh "Harvest $(date -u +%Y-%m-%d)"
      # Runs after the save, so a thin harvest is still kept. A red run here means the harvest ran but its
      # output is not good enough to pick from (see discovery/health/harvest.json).
      - name: Check the harvest is worth reading
        if: ${{ !inputs.shortlist && !inputs.archive_only }}
        run: python discovery/health.py check harvest
